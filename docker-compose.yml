services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sangat
      POSTGRES_PASSWORD: sangat_local_only
      POSTGRES_DB: sangat
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sangat -d sangat']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
